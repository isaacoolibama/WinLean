name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ui:
    name: Build GUI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ui/Cargo.lock') }}

      - name: Check formatting
        working-directory: ui
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: ui
        run: cargo clippy --locked --release -- -D warnings

      - name: Build
        working-directory: ui
        run: cargo build --locked --release

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item ui/target/release/winlean.exe dist/winlean.exe
          Copy-Item WinLean.ps1  dist/
          Copy-Item install.ps1  dist/
          Copy-Item Run.bat      dist/
          Copy-Item README.md    dist/
          Copy-Item LICENSE      dist/
          Compress-Archive -Path dist/* -DestinationPath WinLean.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: winlean
          path: |
            dist/winlean.exe
            WinLean.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/winlean.exe
            WinLean.zip
          generate_release_notes: true
