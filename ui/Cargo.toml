[package]
name        = "winlean-ui"
version     = "1.3.0"
edition     = "2021"
rust-version = "1.88"
description = "Interface grafica do WinLean / WinLean graphical interface"
authors     = ["Isaac Oolibama R. Lacerda"]
license     = "MIT"
repository  = "https://github.com/isaacoolibama/WinLean"

[[bin]]
name = "winlean"
path = "src/main.rs"

[target.'cfg(not(target_os = "windows"))'.dependencies]
# ratatui reexporta o crossterm na versao correta, o que evita conflito de versao
# entre os dois crates. Por isso o crossterm nao aparece como dependencia direta.
ratatui = "0.29"

[target.'cfg(target_os = "windows")'.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
wry = { version = "0.56.1", default-features = false, features = ["os-webview"] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level     = "z"      # binario pequeno: a interface nao e CPU-bound
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
